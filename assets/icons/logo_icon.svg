<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <filter id="glowEffect" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Glowing Background Hexagon / Circle -->
  <rect x="5" y="5" width="90" height="90" rx="24" fill="#0B1120" stroke="url(#neonGrad)" stroke-width="3" filter="url(#glowEffect)" />
  
  <!-- AI Joint Nodes & Skeleton Ring -->
  <circle cx="50" cy="24" r="7" fill="url(#neonGrad)" filter="url(#glowEffect)" />
  
  <!-- Body Pose Skeleton Triangle -->
  <path d="M 50 35 L 26 78 L 74 78 Z" fill="none" stroke="url(#neonGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Spine Line -->
  <line x1="50" y1="35" x2="50" y2="78" stroke="#38BDF8" stroke-width="3.5" stroke-dasharray="2 2" />
  
  <!-- Joint Dots -->
  <circle cx="26" cy="78" r="4.5" fill="#38BDF8" />
  <circle cx="74" cy="78" r="4.5" fill="#38BDF8" />
  <circle cx="50" cy="55" r="4" fill="#10B981" />
  
  <!-- Base Ground Arc -->
  <path d="M 20 86 Q 50 94 80 86" fill="none" stroke="#10B981" stroke-width="3" stroke-linecap="round" />
</svg>
